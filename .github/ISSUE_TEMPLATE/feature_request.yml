name: Feature request
description: Something the library or the docs site should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation where the library falls short, with an example if you have one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: An API sketch or a description is enough. Keep in mind the library has no runtime dependencies and both entries stay small.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you solve it today, if you do.
