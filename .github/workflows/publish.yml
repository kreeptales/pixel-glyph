name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Needed for npm trusted publishing (OIDC) and provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs lint, tests and the build before anything is uploaded.
      - run: npm publish --provenance --access public
